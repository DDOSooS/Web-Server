<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="text-center p-8 max-w-md w-full">
        <div class="inline-block bg-white p-6 rounded-full shadow-md mb-8">
            <svg class="w-24 h-24 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                <path class="text-orange-500" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 7.519A5 5 0 0012 15h.013M12 15a5 5 0 015.013-4.991m-5.013 4.991a5.002 5.002 0 00-5.013-4.991"></path>
                <path class="text-orange-500" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18.75a.75.75 0 100-1.5.75.75 0 000 1.5z"></path>
            </svg>
        </div>

        <h1 class="text-5xl font-bold text-gray-800">400</h1>
        <h2 class="mt-2 text-2xl font-semibold text-gray-600">Bad Request</h2>
        <p class="mt-4 text-gray-500">
            The server couldn't understand your request. Please check your syntax and try again.
        </p>
        <div class="mt-8">
            <a href="/" class="px-6 py-3 font-semibold text-white bg-orange-500 rounded-lg shadow-sm hover:bg-orange-600 transition-colors duration-300">
                Go to Homepage
            </a>
        </div>
    </div>
</body>
</html>
